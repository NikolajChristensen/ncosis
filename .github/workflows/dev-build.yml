name: Build dev APK

# Temporary — builds a release APK on this branch, signed with the fixed key from
# tools/setup-signing.sh so repeat installs update in place instead of needing an uninstall
# first. Delete once the migration is validated and replaced by the real build.yml from
# Phase 10 of /home/musicmad/.claude/plans/validated-dreaming-sutherland.md.
on:
  push:
    branches: [capacitor-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets first (run tools/setup-signing.sh)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > web/android/release.jks

      - name: Build web bundle and sync into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: web/android
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish on the "dev-build" prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp web/android/app/build/outputs/apk/release/app-release.apk ncosis-dev.apk
          gh release view dev-build >/dev/null 2>&1 || \
            gh release create dev-build --prerelease --title "Dev build (signed)" \
              --notes "Signed build for testing the backend-removal migration." --target "$GITHUB_SHA"
          gh release upload dev-build ncosis-dev.apk --clobber
          gh release edit dev-build --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}."
