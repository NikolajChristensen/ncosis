name: Build dev APK

# Temporary — builds an unsigned debug APK on this branch so it can be sideloaded straight from
# a phone browser for testing, with no cable or signing setup. Delete once the migration is
# validated and replaced by the real build.yml from Phase 10 of
# /home/musicmad/.claude/plans/validated-dreaming-sutherland.md.
on:
  push:
    branches: [capacitor-migration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web bundle and sync into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish on the "dev-build" prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp web/android/app/build/outputs/apk/debug/app-debug.apk ncosis-dev.apk
          gh release view dev-build >/dev/null 2>&1 || \
            gh release create dev-build --prerelease --title "Dev build (debug, unsigned)" \
              --notes "Throwaway debug build for testing the backend-removal migration." --target "$GITHUB_SHA"
          gh release upload dev-build ncosis-dev.apk --clobber
          gh release edit dev-build --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}."
