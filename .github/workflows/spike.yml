name: Build spike APK

# Temporary — builds an unsigned debug APK of the Capacitor Phase 0 spike (see
# /home/musicmad/.claude/plans/validated-dreaming-sutherland.md) so it can be sideloaded
# straight from a phone browser with no cable or signing setup. Delete this workflow once
# the spike has been deleted and replaced by the real build.yml from Phase 10.
on:
  push:
    branches: [capacitor-migration]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web bundle and sync into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish on the "spike-build" prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp web/android/app/build/outputs/apk/debug/app-debug.apk ncosis-spike.apk
          gh release view spike-build >/dev/null 2>&1 || \
            gh release create spike-build --prerelease --title "Phase 0 spike (debug, unsigned)" \
              --notes "Throwaway Capacitor spike build. Not for real use." --target "$GITHUB_SHA"
          gh release upload spike-build ncosis-spike.apk --clobber
          gh release edit spike-build --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}."
