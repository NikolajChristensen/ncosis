name: Build APK

# Builds a signed release APK and publishes it on the "latest" release, so the phone can always
# download it from the same place. Re-pushing to master updates that same release in place.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets first (run tools/setup-signing.sh)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > web/android/release.jks

      - name: Build web bundle and sync into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Version code
        id: version
        run: echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: web/android
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # A unix timestamp, not github.run_number: run_number resets if the workflow file is
          # ever renamed/recreated (as happened going from dev-build.yml to this file), and
          # Android refuses to install an APK whose versionCode is lower than what's already
          # installed — even with a matching signature. A timestamp only ever increases.
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish on the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp web/android/app/build/outputs/apk/release/app-release.apk ncosis.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest build" --notes "Built automatically from master." --target "$GITHUB_SHA"
          gh release upload latest ncosis.apk --clobber
          gh release edit latest --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}."

      - uses: actions/upload-artifact@v4
        with:
          name: ncosis-apk
          path: ncosis.apk
